<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCU Movie Marathon</title>
<meta name="theme-color" content="#b3121b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MCU Movies">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root { --bg:#f6f1e7; --paper:#ffffff; --ink:#1d1f24; --muted:#6b6658; --line:#e2dac6; --hero:#b3121b; --hero-ink:#fffdf7; --gold:#ffcc1f; --track:#7a0c12; --seen:#2e9e5b; --seen-bg:#e2f4e8; --next:#2b7de9; --imdb:#f5c518; --fresh:#fa320a; --rotten:#3fa142; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16171b; --paper:#24262c; --ink:#f2efe6; --muted:#a8a294; --line:#363841; --hero:#8f0e15; --track:#4c070b; --seen:#4cc47c; --seen-bg:#1d3326; --next:#5b9cf0; } }
  :root[data-theme="dark"] { --bg:#16171b; --paper:#24262c; --ink:#f2efe6; --muted:#a8a294; --line:#363841; --hero:#8f0e15; --track:#4c070b; --seen:#4cc47c; --seen-bg:#1d3326; --next:#5b9cf0; }
  * { box-sizing:border-box; }
  html { touch-action:manipulation; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Fredoka",system-ui,sans-serif; padding:0 16px max(32px, env(safe-area-inset-bottom,0px)); min-height:100dvh; }
  header { position:sticky; top:0; z-index:2; margin-inline:-16px; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px; background:var(--hero); color:var(--hero-ink); background-image:radial-gradient(rgba(255,255,255,.09) 2px, transparent 2.5px); background-size:14px 14px; box-shadow:0 4px 0 var(--gold); }
  .wrap { max-width:760px; margin:0 auto; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-family:"Bangers","Fredoka",system-ui,sans-serif; font-weight:400; letter-spacing:.04em; font-size:2rem; margin:0; line-height:1; text-shadow:2px 2px 0 rgba(0,0,0,.35); }
  .score { font-weight:700; font-size:2rem; font-variant-numeric:tabular-nums; color:var(--gold); line-height:1; white-space:nowrap; }
  .score small { font-size:1rem; color:var(--hero-ink); opacity:.85; margin-left:3px; }
  .bar { height:12px; background:var(--track); border-radius:99px; margin-top:10px; overflow:hidden; }
  .bar > div { height:100%; width:0%; background:var(--gold); border-radius:99px; transition:width .3s ease; }
  .order { display:flex; margin-top:10px; background:rgba(0,0,0,.22); border-radius:99px; padding:3px; }
  .order button { flex:1; font:inherit; font-weight:600; font-size:.95rem; color:var(--hero-ink); background:transparent; border:0; border-radius:99px; padding:7px 10px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .order button[aria-pressed="true"] { background:var(--gold); color:#1d1f24; }
  .hint { margin:14px 0 4px; color:var(--muted); font-size:.9rem; text-align:center; }
  ol { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:10px; }
  .movie { width:100%; display:grid; grid-template-columns:28px 52px 1fr 44px; align-items:center; gap:10px; text-align:left; font:inherit; color:inherit; background:var(--paper); border:3px solid var(--line); border-radius:18px; padding:10px 12px 10px 8px; cursor:pointer; position:relative; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; transition:transform .12s ease, background .15s, border-color .15s; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .movie:active { transform:scale(.98); }
  .movie:focus-visible { outline:3px solid var(--next); outline-offset:2px; }
  .num { font-weight:700; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums; }
  .badge { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:1.8rem; background:var(--c); box-shadow:inset 0 -4px 0 rgba(0,0,0,.18); }
  .info { min-width:0; }
  .title { display:block; font-weight:700; font-size:1.08rem; line-height:1.2; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; font-size:.85rem; font-weight:600; align-items:center; }
  .yr { color:var(--muted); }
  .pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; white-space:nowrap; }
  .imdb { background:var(--imdb); color:#1d1f24; }
  .imdb b { font-weight:700; font-size:.72rem; letter-spacing:.02em; }
  .rt { background:var(--fresh); color:#fff; }
  .rt.rotten { background:var(--rotten); }
  .soon { background:var(--line); color:var(--ink); }
  .check { width:44px; height:44px; border-radius:50%; border:3px dashed var(--line); display:grid; place-items:center; font-size:1.6rem; font-weight:700; color:transparent; transition:transform .22s cubic-bezier(.3,1.6,.6,1), background .15s, border-color .15s; }
  .movie.seen { background:var(--seen-bg); border-color:var(--seen); }
  .movie.seen .check { background:var(--seen); border:3px solid var(--seen); color:#fff; transform:scale(1.08); }
  .movie.next { border-color:var(--next); }
  .movie.next::after { content:"Up next!"; position:absolute; top:-11px; right:14px; background:var(--next); color:#fff; font-size:.75rem; font-weight:700; padding:2px 9px; border-radius:99px; }
  .movie.upcoming { cursor:default; opacity:.7; border-style:dashed; box-shadow:none; }
  .movie.upcoming:active { transform:none; }
  .movie.upcoming .check { border-color:transparent; font-size:1.3rem; color:var(--muted); }
  .done { display:none; margin:12px 0 14px; padding:14px; border-radius:18px; background:var(--gold); color:#1d1f24; text-align:center; font-weight:700; }
  .done.show { display:block; animation:pop .6s cubic-bezier(.3,1.6,.6,1) both; }
  .done .big { display:block; font-size:2.2rem; line-height:1.1; }
  .done .big span { display:inline-block; animation:bounce 1.1s ease-in-out infinite; }
  .done .big span:nth-child(2) { animation-delay:.15s; }
  .done .big span:nth-child(3) { animation-delay:.3s; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes bounce { 0%,100% { transform:translateY(0) rotate(-6deg); } 50% { transform:translateY(-14px) rotate(6deg); } }
  .zap { position:absolute; inset:0; margin:auto; width:max-content; height:max-content; font-family:"Bangers",system-ui,sans-serif; font-size:2rem; letter-spacing:.05em; color:var(--gold); -webkit-text-stroke:1.5px #1d1f24; pointer-events:none; animation:zap .8s ease-out forwards; }
  @keyframes zap { 0% { transform:scale(.3) rotate(-12deg); opacity:0; } 30% { transform:scale(1.15) rotate(-6deg); opacity:1; } 100% { transform:scale(1.4) rotate(-6deg) translateY(-14px); opacity:0; } }
  #confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; display:none; }
  #confetti.on { display:block; }
  footer { margin:22px 0 0; color:var(--muted); font-size:.8rem; text-align:center; line-height:1.5; }
  @media (max-width:420px) {
    h1 { font-size:1.6rem; }
    .score { font-size:1.7rem; }
    .movie { grid-template-columns:22px 44px 1fr 38px; gap:8px; padding:9px 10px 9px 6px; }
    .badge { width:44px; height:44px; font-size:1.5rem; border-radius:12px; }
    .check { width:38px; height:38px; font-size:1.35rem; }
    .title { font-size:1rem; }
    .meta { font-size:.8rem; gap:5px; }
  }
  @media (prefers-reduced-motion:reduce) { .movie,.check,.bar>div { transition:none; } .done.show,.done .big span,.zap { animation:none; } .zap { display:none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row">
      <h1>MCU Movie Marathon</h1>
      <div class="score"><span id="count">0</span><small>/ <span id="total">0</span></small></div>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="order" role="group" aria-label="Sort movies">
      <button type="button" data-order="story" aria-pressed="true">Story order</button>
      <button type="button" data-order="release" aria-pressed="false">Release order</button>
    </div>
  </div>
</header>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="wrap">
  <p class="hint" id="hint">Tap a movie when you've watched it!</p>
  <div class="done" id="done" role="status"><span class="big"><span>🦸</span><span>🏆</span><span>🍿</span></span>You watched EVERY Marvel movie!</div>
  <ol id="list"></ol>
  <footer>⭐ IMDb rating out of 10 &nbsp;·&nbsp; 🍅 Rotten Tomatoes critics score<br>Ratings as of <span id="asof"></span>. Your checkmarks are saved on this device.</footer>
</main>
<script>
  // story = in-universe timeline position. Ratings: IMDb /10 and Rotten Tomatoes Tomatometer %.
  // A film whose release date is still in the future shows as "coming soon" and isn't counted.
  const RATINGS_AS_OF="October 2026";
  const MOVIES=[
    {id:"iron-man",          title:"Iron Man",                                   released:"2008-05-02", story:3,  imdb:7.9, rt:94, emoji:"🦾", c:"#e0402a"},
    {id:"incredible-hulk",   title:"The Incredible Hulk",                        released:"2008-06-13", story:5,  imdb:6.6, rt:67, emoji:"💪", c:"#4caf50"},
    {id:"iron-man-2",        title:"Iron Man 2",                                 released:"2010-05-07", story:4,  imdb:6.9, rt:71, emoji:"🤖", c:"#f0a020"},
    {id:"thor",              title:"Thor",                                       released:"2011-05-06", story:6,  imdb:7.0, rt:77, emoji:"⚡", c:"#7bb8f0"},
    {id:"first-avenger",     title:"Captain America: The First Avenger",         released:"2011-07-22", story:1,  imdb:6.9, rt:80, emoji:"🛡️", c:"#3a6fd8"},
    {id:"avengers",          title:"The Avengers",                               released:"2012-05-04", story:7,  imdb:8.0, rt:91, emoji:"🦸", c:"#9a7bea"},
    {id:"iron-man-3",        title:"Iron Man 3",                                 released:"2013-05-03", story:9,  imdb:7.1, rt:79, emoji:"🔥", c:"#ff7043"},
    {id:"dark-world",        title:"Thor: The Dark World",                       released:"2013-11-08", story:8,  imdb:6.7, rt:66, emoji:"🔨", c:"#8d9bb0"},
    {id:"winter-soldier",    title:"Captain America: The Winter Soldier",        released:"2014-04-04", story:10, imdb:7.7, rt:90, emoji:"❄️", c:"#90caf9"},
    {id:"guardians",         title:"Guardians of the Galaxy",                    released:"2014-08-01", story:11, imdb:8.0, rt:92, emoji:"🚀", c:"#ff8a65"},
    {id:"age-of-ultron",     title:"Avengers: Age of Ultron",                    released:"2015-05-01", story:13, imdb:7.3, rt:76, emoji:"🤖", c:"#b0bec5"},
    {id:"ant-man",           title:"Ant-Man",                                    released:"2015-07-17", story:14, imdb:7.3, rt:83, emoji:"🐜", c:"#ef5350"},
    {id:"civil-war",         title:"Captain America: Civil War",                 released:"2016-05-06", story:15, imdb:7.8, rt:90, emoji:"⚔️", c:"#5c7cfa"},
    {id:"doctor-strange",    title:"Doctor Strange",                             released:"2016-11-04", story:19, imdb:7.5, rt:89, emoji:"🌀", c:"#ab47bc"},
    {id:"guardians-2",       title:"Guardians of the Galaxy Vol. 2",             released:"2017-05-05", story:12, imdb:7.6, rt:85, emoji:"🌱", c:"#66bb6a"},
    {id:"homecoming",        title:"Spider-Man: Homecoming",                     released:"2017-07-07", story:18, imdb:7.4, rt:92, emoji:"🕷️", c:"#e53935"},
    {id:"ragnarok",          title:"Thor: Ragnarok",                             released:"2017-11-03", story:20, imdb:7.9, rt:93, emoji:"🌈", c:"#ec407a"},
    {id:"black-panther",     title:"Black Panther",                              released:"2018-02-16", story:17, imdb:7.3, rt:96, emoji:"🐾", c:"#7e57c2"},
    {id:"infinity-war",      title:"Avengers: Infinity War",                     released:"2018-04-27", story:22, imdb:8.4, rt:85, emoji:"💎", c:"#8e24aa"},
    {id:"ant-man-wasp",      title:"Ant-Man and the Wasp",                       released:"2018-07-06", story:21, imdb:7.0, rt:87, emoji:"🐝", c:"#ffca28"},
    {id:"captain-marvel",    title:"Captain Marvel",                             released:"2019-03-08", story:2,  imdb:6.8, rt:79, emoji:"⭐", c:"#42a5f5"},
    {id:"endgame",           title:"Avengers: Endgame",                          released:"2019-04-26", story:23, imdb:8.4, rt:94, emoji:"🧤", c:"#ffb300"},
    {id:"far-from-home",     title:"Spider-Man: Far From Home",                  released:"2019-07-02", story:24, imdb:7.4, rt:90, emoji:"✈️", c:"#26a69a"},
    {id:"black-widow",       title:"Black Widow",                                released:"2021-07-09", story:16, imdb:6.7, rt:79, emoji:"🕸️", c:"#546e7a"},
    {id:"shang-chi",         title:"Shang-Chi and the Legend of the Ten Rings",  released:"2021-09-03", story:25, imdb:7.4, rt:91, emoji:"🐉", c:"#ef6c00"},
    {id:"eternals",          title:"Eternals",                                   released:"2021-11-05", story:26, imdb:6.3, rt:47, emoji:"☀️", c:"#ffd54f"},
    {id:"no-way-home",       title:"Spider-Man: No Way Home",                    released:"2021-12-17", story:27, imdb:8.2, rt:93, emoji:"🕷️", c:"#1e88e5"},
    {id:"multiverse-madness",title:"Doctor Strange in the Multiverse of Madness",released:"2022-05-06", story:28, imdb:6.9, rt:73, emoji:"🔮", c:"#d81b60"},
    {id:"love-and-thunder",  title:"Thor: Love and Thunder",                     released:"2022-07-08", story:29, imdb:6.2, rt:63, emoji:"🐐", c:"#f06292"},
    {id:"wakanda-forever",   title:"Black Panther: Wakanda Forever",             released:"2022-11-11", story:30, imdb:6.7, rt:83, emoji:"🌊", c:"#26c6da"},
    {id:"quantumania",       title:"Ant-Man and the Wasp: Quantumania",          released:"2023-02-17", story:31, imdb:6.1, rt:46, emoji:"⚛️", c:"#7c4dff"},
    {id:"guardians-3",       title:"Guardians of the Galaxy Vol. 3",             released:"2023-05-05", story:32, imdb:7.9, rt:82, emoji:"🦝", c:"#8d6e63"},
    {id:"the-marvels",       title:"The Marvels",                                released:"2023-11-10", story:33, imdb:5.5, rt:62, emoji:"🐱", c:"#ffa726"},
    {id:"deadpool-wolverine",title:"Deadpool & Wolverine",                       released:"2024-07-26", story:34, imdb:7.6, rt:78, emoji:"🗡️", c:"#c62828"},
    {id:"brave-new-world",   title:"Captain America: Brave New World",           released:"2025-02-14", story:35, imdb:5.7, rt:48, emoji:"🦅", c:"#1565c0"},
    {id:"thunderbolts",      title:"Thunderbolts*",                              released:"2025-05-02", story:36, imdb:7.2, rt:88, emoji:"🌩️", c:"#78909c"},
    {id:"fantastic-four",    title:"The Fantastic Four: First Steps",            released:"2025-07-25", story:37, imdb:7.1, rt:86, emoji:"4️⃣", c:"#29b6f6"},
    {id:"brand-new-day",     title:"Spider-Man: Brand New Day",                  released:"2026-07-31", story:38, imdb:null,rt:null,emoji:"🕷️", c:"#d32f2f"},
    {id:"doomsday",          title:"Avengers: Doomsday",                         released:"2026-12-18", story:39, imdb:null,rt:null,emoji:"💀", c:"#455a64"},
  ];

  const KEY="mcu-watched-v1", ORDER_KEY="mcu-order-v1";
  const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
  const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  // Ask the browser not to clear our saved checkmarks when it's tidying up storage.
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

  const ids=new Set(MOVIES.map(m=>m.id));
  let seen=new Set(load(KEY,[]).filter(id=>ids.has(id)));
  let order=load(ORDER_KEY,"story")==="release"?"release":"story";
  const now=new Date(), today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const isOut=m=>m.released<=today;
  const out=()=>MOVIES.filter(isOut);
  const list=document.getElementById("list");
  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fmtDate=s=>new Date(s+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  document.getElementById("asof").textContent=RATINGS_AS_OF;

  function card(m,i){
    const li=document.createElement("li");
    const b=document.createElement("button");
    b.type="button";b.className="movie";b.dataset.id=m.id;b.style.setProperty("--c",m.c);
    const year=m.released.slice(0,4);
    let meta;
    if(!isOut(m)) meta=`<span class="pill soon">🎬 In theaters ${fmtDate(m.released)}</span>`;
    else meta=`<span class="yr">${year}</span>`+
      `<span class="pill imdb">⭐ ${m.imdb!=null?m.imdb.toFixed(1):"–"} <b>IMDb</b></span>`+
      `<span class="pill rt${m.rt!=null&&m.rt<60?" rotten":""}">🍅 ${m.rt!=null?m.rt+"%":"–"}</span>`;
    b.innerHTML=`<span class="num">${i+1}</span><span class="badge" aria-hidden="true">${m.emoji}</span>`+
      `<span class="info"><span class="title">${m.title}</span><span class="meta">${meta}</span></span>`+
      `<span class="check" aria-hidden="true">${isOut(m)?"✓":"⏳"}</span>`;
    if(!isOut(m)){b.classList.add("upcoming");b.setAttribute("aria-disabled","true");}
    b.addEventListener("click",()=>toggle(m,b));
    li.appendChild(b);
    return li;
  }

  function draw(){
    const sorted=[...MOVIES].sort(order==="story"?(a,b)=>a.story-b.story:(a,b)=>a.released.localeCompare(b.released));
    list.replaceChildren(...sorted.map(card));
    document.querySelectorAll(".order button").forEach(btn=>btn.setAttribute("aria-pressed",btn.dataset.order===order));
    sync();
  }

  function sync(){
    const total=out().length, count=out().filter(m=>seen.has(m.id)).length;
    let nextMarked=false;
    list.querySelectorAll(".movie").forEach(b=>{
      const m=MOVIES.find(x=>x.id===b.dataset.id), s=seen.has(m.id);
      b.classList.toggle("seen",s);
      if(isOut(m))b.setAttribute("aria-pressed",s);
      b.setAttribute("aria-label",`${m.title}${isOut(m)?(s?", watched":", not watched yet"):", coming soon"}`);
      const isNext=!nextMarked&&!s&&isOut(m)&&count>0;
      b.classList.toggle("next",isNext);
      if(isNext)nextMarked=true;
    });
    document.getElementById("count").textContent=count;
    document.getElementById("total").textContent=total;
    document.getElementById("bar").style.width=(total?count/total*100:0)+"%";
    document.getElementById("done").classList.toggle("show",total>0&&count===total);
    document.getElementById("hint").textContent=!count?"Tap a movie when you've watched it!":count===total?"Marvel marathon complete!":`${total-count} to go — keep watching!`;
  }

  function toggle(m,b){
    if(!isOut(m))return;
    if(seen.has(m.id)){
      // Watched movies stay watched — only undo if someone really means it.
      if(!confirm(`Oops? Un-check "${m.title}" so it shows as NOT watched?`))return;
      seen.delete(m.id);
    }else{
      const wasDone=out().every(x=>seen.has(x.id));
      seen.add(m.id);
      if(navigator.vibrate)navigator.vibrate(30);
      zap(b);
      if(!wasDone&&out().every(x=>seen.has(x.id)))celebrate();
    }
    store(KEY,[...seen]);
    sync();
  }

  const WORDS=["POW!","BAM!","ZAP!","WHAM!","KABOOM!","THWIP!","SMASH!"];
  function zap(b){
    if(reduceMotion)return;
    const z=document.createElement("span");z.className="zap";z.setAttribute("aria-hidden","true");
    z.textContent=WORDS[Math.floor(Math.random()*WORDS.length)];
    b.appendChild(z);z.addEventListener("animationend",()=>z.remove());
  }

  function celebrate(){
    if(navigator.vibrate)navigator.vibrate([40,60,40,60,120]);
    document.getElementById("done").scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"center"});
    if(reduceMotion)return;
    const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
    const dpr=Math.min(devicePixelRatio||1,2);
    cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.scale(dpr,dpr);cv.classList.add("on");
    const colors=["#ffcc1f","#b3121b","#2b7de9","#2e9e5b","#ffffff","#ab47bc"];
    const bits=[],origins=[[innerWidth*.12,-4],[innerWidth*.5,0],[innerWidth*.88,4]];
    for(let i=0;i<300;i++){
      const [ox,lean]=origins[i%3];
      const ang=(-90+lean*8+(Math.random()-.5)*80)*Math.PI/180,sp=13+Math.random()*13;
      bits.push({x:ox,y:innerHeight+10,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,w:8+Math.random()*7,h:10+Math.random()*10,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,c:colors[Math.floor(Math.random()*colors.length)]});
    }
    const start=performance.now();
    (function frame(t){
      const el=(t-start)/1000;let alive=0;
      ctx.clearRect(0,0,innerWidth,innerHeight);
      for(const p of bits){
        p.vy+=.2;p.vy*=.985;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
        if(p.y<innerHeight+30)alive++;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
        ctx.globalAlpha=Math.max(0,1-Math.max(0,el-3.5)/1.5);
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
      }
      if(alive&&el<5.5)requestAnimationFrame(frame);else{cv.classList.remove("on");ctx.clearRect(0,0,innerWidth,innerHeight);}
    })(start);
  }

  document.querySelectorAll(".order button").forEach(btn=>btn.addEventListener("click",()=>{
    order=btn.dataset.order;store(ORDER_KEY,order);draw();
  }));
  document.addEventListener("dblclick",e=>{if(e.target.closest(".movie"))e.preventDefault();});
  draw();
</script>
</body>
</html>
